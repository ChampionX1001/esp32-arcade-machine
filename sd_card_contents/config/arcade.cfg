# Arcade Machine Configuration File
# Copy this file to your SD card at: /config/arcade.cfg

# Display Settings
display_width=320
display_height=240
display_rotation=0

# Game Settings
default_game=snake
difficulty=medium
sound_enabled=true
volume=80

# Control Pins (GPIO)
