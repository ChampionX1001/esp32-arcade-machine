; PlatformIO Project Configuration File for ESP32 Arcade Machine
;
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Note: Using 'esp32dev' as a generic ESP32 board configuration.
; This works for most ESP32 variants including ESP32-WROOM, ESP32-WROVER, etc.
; If you have a specific ESP32 variant (e.g., ESP32-S2, ESP32-C3), 
; update the 'board' parameter accordingly:
;   - ESP32-S2: board = esp32-s2-saola-1
;   - ESP32-C3: board = esp32-c3-devkitm-1
;   - ESP32-S3: board = esp32-s3-devkitc-1

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor options
monitor_speed = 115200

; Libraries required for SD card and display
lib_deps = 
    ; SD card support is built into ESP32 Arduino framework
    ; Add display libraries as needed:
    ; adafruit/Adafruit GFX Library @ ^1.11.3
    ; adafruit/Adafruit ILI9341 @ ^1.5.10
    ; bodmer/TFT_eSPI @ ^2.5.0

; Build flags
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM

; Upload settings
upload_speed = 921600
